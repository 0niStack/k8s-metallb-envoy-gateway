# !!! CHANGE the range to free IPs in YOUR LAN (same subnet as your nodes) !!!
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: gateway-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: gateway-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - gateway-pool
