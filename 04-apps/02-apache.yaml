apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-index
  namespace: web
data:
  index.html: |
    <h1>Hello from APACHE (02)</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: apache }
  template:
    metadata:
      labels: { app: apache }
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: apache-index
---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: web
spec:
  selector: { app: apache }
  ports:
    - port: 80
      targetPort: 80
