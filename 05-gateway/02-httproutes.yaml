apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: web
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - nginx.example.local
  rules:
    - backendRefs:
        - name: nginx
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apache-route
  namespace: web
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - apache.example.local
  rules:
    - backendRefs:
        - name: apache
          port: 80
